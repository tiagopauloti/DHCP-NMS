name: Compilar DHCP NMS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Release
        run: cargo build --release

      - name: Disponibilizar .exe para download
        uses: actions/upload-artifact@v4
        with:
          name: dhcp_nms_windows
          path: target/release/dhcp-nms.exe
